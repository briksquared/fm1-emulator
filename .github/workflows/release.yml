name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win -- --publish never
            feed: latest.yml
          - os: macos-latest
            cmd: npm run dist:mac -- --publish never
            feed: latest-mac.yml
          - os: ubuntu-latest
            cmd: npm run dist:linux -- --publish never
            feed: latest-linux.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Verify firmware catalog and stability patch
        run: npm test
      - name: Exercise all-firmware search (Windows and macOS)
        if: matrix.os != 'ubuntu-latest'
        run: npm start
        env:
          FM1_SELFTEST: search
          FM1_SOFTWARE_RENDERING: "1"
      - name: Exercise all-firmware search (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm start -- --no-sandbox
        env:
          FM1_SELFTEST: search
          FM1_SOFTWARE_RENDERING: "1"
      - name: Boot AURORA in the full app (Windows and macOS)
        if: matrix.os != 'ubuntu-latest'
        run: npm start
        env:
          FM1_SELFTEST: boot
          FM1_SELFTEST_FW: aurora
          FM1_SOFTWARE_RENDERING: "1"
      - name: Boot AURORA in the full app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm start -- --no-sandbox
        env:
          FM1_SELFTEST: boot
          FM1_SELFTEST_FW: aurora
          FM1_SOFTWARE_RENDERING: "1"
      # electron-builder only builds here (--publish never); the release step below uploads
      # everything once, so assets are not uploaded twice under different names.
      - name: Build
        run: ${{ matrix.cmd }}
        env:
          # No Apple Developer ID cert: let electron-builder skip its own signing;
          # build/after-pack.js then ad-hoc signs the .app so arm64 will launch it.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The in-app updater reads latest.yml / latest-mac.yml / latest-linux.yml and the
      # blockmaps; a release without its platform's feed cannot offer that platform the update.
      - name: Check update feed
        shell: bash
        run: |
          test -s "dist/${{ matrix.feed }}" || { echo "missing dist/${{ matrix.feed }}"; ls dist; exit 1; }
          cat "dist/${{ matrix.feed }}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fm1-emulator-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          fail_on_unmatched_files: false
